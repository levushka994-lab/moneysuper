<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Админка — AutoR</title>
<meta name="description" content="Админка AutoR: пользователи кабинета и промокоды на доступ." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23FFC63D'/%3E%3Cpath d='M18.4 6 10 18h5l-1.4 8 8.4-12h-5z' fill='%231B1B1A'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="admin.css" />
</head>
<body>

<!-- Вход -->
<section class="entry" id="entry">
  <form class="entry-card" id="login-form" autocomplete="on">
    <div class="brand">
      <span class="brand-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.6 2 4 15h6.2L8.6 22 20 8.6h-6.4z"/></svg></span>
      <span class="brand-name">AutoR <em>Admin</em></span>
    </div>
    <h1>Вход в админку</h1>
    <p class="entry-sub">Доступ к пользователям кабинета и промокодам магазина.</p>

    <label class="field">
      <span>Почта</span>
      <input id="login-email" type="email" name="email" value="admin@autor.app" autocomplete="username" required />
    </label>
    <label class="field">
      <span>Пароль</span>
      <input id="login-password" type="password" name="password" value="admin" autocomplete="current-password" required />
    </label>

    <button class="btn btn-primary btn-block" type="submit">Войти</button>
    <p class="entry-hint">Демо-доступ: <b>admin@autor.app</b> и любой пароль от 3 символов.</p>
  </form>
</section>

<!-- Кабинет админки -->
<div class="shell" id="shell" hidden>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.6 2 4 15h6.2L8.6 22 20 8.6h-6.4z"/></svg></span>
      <span class="brand-name">AutoR <em>Admin</em></span>
    </div>

    <nav class="tabs" id="tabs" aria-label="Разделы админки">
      <button class="tab is-active" type="button" data-tab="users">Пользователи <span class="tab-count" id="users-count">0</span></button>
      <button class="tab" type="button" data-tab="promos">Промокоды <span class="tab-count" id="promos-count">0</span></button>
    </nav>

    <div class="topbar-right">
      <span class="who" id="who"></span>
      <button class="btn btn-ghost" type="button" id="logout">Выйти</button>
    </div>
  </header>

  <main class="page" id="view"></main>
</div>

<div class="modal" id="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <header class="modal-head">
      <h2 id="modal-title"></h2>
      <button class="icon-btn" type="button" data-modal-close aria-label="Закрыть">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </header>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="admin.js"></script>
</body>
</html>
