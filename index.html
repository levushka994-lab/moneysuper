    AutoR — каркас страницы. Здесь только разметка, иконки и подключение файлов.

      assets/css/foundation.css     шрифты, токены, сброс, каркас
      assets/css/components.css     кнопки, карточки, таблицы, модалы, тосты

      assets/css/responsive.css     адаптив
      assets/js/seed.js             данные магазина (window.AUTOR_SEED)

      assets/js/billing.js          доступ, промокоды, тарифы
